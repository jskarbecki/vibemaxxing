<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vibemaxxing</title>
<link rel="icon" href="data:,">
<style>
  :root {
    color-scheme: light dark;
    --bg: #faf9f7;
    --text: #1a1917;
    --dim: #6b6862;
    --accent: #3d6b99;
    --warn: #9a5115;
    --hairline: color-mix(in oklab, var(--text) 14%, var(--bg));
    --track: color-mix(in oklab, var(--text) 9%, var(--bg));
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121110;
      --text: #e8e6e1;
      --dim: #918d85;
      --accent: #7fa8d6;
      --warn: #d98f4e;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    padding: 22px 40px 26px;
    background: var(--bg);
    color: var(--text);
    font: 400 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent); color: var(--bg); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .wrap { max-width: 1400px; margin: 0 auto; }

  .status {
    display: flex;
    justify-content: flex-end;
    padding-bottom: 12px;
    color: var(--dim);
    font-size: 12px;
  }
  .status[data-bad="1"] { color: var(--warn); }

  .accounts { margin: 0; padding: 0; list-style: none; }
  .account {
    display: grid;
    grid-template-columns: 200px minmax(0, 1fr);
    gap: 24px;
    padding: 20px 0;
  }
  .account + .account { border-top: 1px solid var(--hairline); }

  .name { font-size: 15px; font-weight: 600; letter-spacing: -0.005em; }
  .badge {
    margin-left: 8px;
    color: var(--accent);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    vertical-align: 1px;
  }
  .who {
    margin-top: 3px;
    color: var(--dim);
    font-size: 12px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .plan {
    margin-top: 2px;
    color: var(--dim);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.07em;
    text-transform: uppercase;
  }

  .limits { display: grid; gap: 7px; align-content: start; }
  .limit {
    display: grid;
    grid-template-columns: 168px minmax(0, 1fr) 46px 148px;
    gap: 14px;
    align-items: center;
    font-size: 13px;
  }
  .limit-label { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .track { height: 6px; border-radius: 2px; background: var(--track); }
  .fill {
    display: block;
    width: 0;
    height: 100%;
    border-radius: 2px;
    background: var(--accent);
    transition: width 240ms cubic-bezier(0.23, 1, 0.32, 1);
  }
  .fill[data-severity="warn"] { background: var(--warn); }
  .percent { font-weight: 500; text-align: right; }
  .resets { color: var(--dim); font-size: 12px; text-align: right; }

  .split { margin-top: 3px; }
  .split .value { grid-column: 2 / -1; color: var(--dim); font-size: 12px; }
  .state { color: var(--warn); font-size: 13px; }

  .pool {
    margin-top: 4px;
    padding-top: 16px;
    border-top: 1px solid var(--hairline);
    color: var(--dim);
    font-size: 13px;
  }

  @media (prefers-reduced-motion: reduce) {
    .fill { transition: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="status" id="status">loading</div>
  <ul class="accounts" id="accounts"></ul>
  <div class="pool" id="pool"></div>
</div>
<script>
  var ENDPOINT = 'api/usage';
  var POLL_MS = 60000;
  var CLOCK_MS = 30000;

  var statusEl = document.getElementById('status');
  var listEl = document.getElementById('accounts');
  var poolEl = document.getElementById('pool');
  var signature = '';
  var nodes = [];
  var lastUpdate = '';

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function clock(iso) {
    var date = new Date(iso);
    if (isNaN(date.getTime())) return iso;
    return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }

  function relative(iso, now) {
    var date = new Date(iso);
    if (isNaN(date.getTime())) return '';
    var delta = date.getTime() - now;
    if (delta <= 0) return 'reset due';
    var minutes = Math.round(delta / 60000);
    if (minutes < 60) return 'resets in ' + minutes + ' min';
    if (delta < 12 * 3600000) {
      var hours = Math.floor(minutes / 60);
      var rest = minutes % 60;
      return 'resets in ' + hours + ' hr' + (rest ? ' ' + rest + ' min' : '');
    }
    return 'resets ' + date.toLocaleDateString([], { weekday: 'short' }) + ' ' +
      date.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }

  function buildAccount(account) {
    var item = el('li', 'account');
    var identity = el('div');
    var name = el('div', 'name', account.alias);
    if (account.active) name.appendChild(el('span', 'badge', 'active'));
    identity.appendChild(name);
    var who = account.email || account.organization;
    if (who) identity.appendChild(el('div', 'who', who));
    if (account.plan) identity.appendChild(el('div', 'plan', account.plan));
    item.appendChild(identity);

    var limits = el('div', 'limits');
    var refs = { rows: [], split: null };

    // message is null while the account is ok, and carries the recovery command
    // ("run: vibe add work") when it is not.
    if (account.message) {
      limits.appendChild(el('div', 'state', account.message));
    } else if (!account.rows.length) {
      limits.appendChild(el('div', 'state', 'no limits reported'));
    }

    account.rows.forEach(function (row) {
      var line = el('div', 'limit');
      line.appendChild(el('span', 'limit-label', row.label));
      var track = el('span', 'track');
      track.setAttribute('aria-hidden', 'true');
      var fill = el('span', 'fill');
      track.appendChild(fill);
      line.appendChild(track);
      var percent = el('span', 'percent');
      var resets = el('span', 'resets');
      line.appendChild(percent);
      line.appendChild(resets);
      limits.appendChild(line);
      refs.rows.push({ fill: fill, percent: percent, resets: resets });
    });

    if (account.breakdown.length) {
      var split = el('div', 'limit split');
      split.appendChild(el('span', 'limit-label', '7-day split'));
      refs.split = el('span', 'value');
      split.appendChild(refs.split);
      limits.appendChild(split);
    }

    item.appendChild(limits);
    nodes.push(refs);
    return item;
  }

  function paintTimes() {
    var now = Date.now();
    var stamps = document.querySelectorAll('.resets');
    for (var i = 0; i < stamps.length; i++) {
      var iso = stamps[i].dataset.resetsAt;
      stamps[i].textContent = iso ? relative(iso, now) : '';
    }
  }

  function paintPool(pool) {
    var parts = [pool.accounts + (pool.accounts === 1 ? ' account' : ' accounts'),
      pool.remaining_account_weeks + ' account-weeks left'];
    if (typeof pool.dry_in_seconds === 'number') {
      parts.push('dry in ' + (pool.dry_in_seconds / 3600).toFixed(1) + ' hr');
    }
    poolEl.textContent = parts.join(' · ');
  }

  function paint(envelope) {
    envelope.accounts.forEach(function (account, index) {
      var refs = nodes[index];
      account.rows.forEach(function (row, position) {
        var target = refs.rows[position];
        var known = typeof row.percent === 'number' && isFinite(row.percent);
        var value = known ? Math.max(0, Math.min(100, row.percent)) : 0;
        var width = value + '%';
        if (target.fill.style.width !== width) target.fill.style.width = width;
        // Colour comes from severity alone. "normal" is calm and everything
        // else is elevated — never a percentage threshold we invented.
        target.fill.dataset.severity = row.severity === 'normal' ? 'normal' : 'warn';
        target.percent.textContent = known ? row.percent + '%' : '—';
        target.resets.dataset.resetsAt = row.resets_at || '';
      });
      if (refs.split) {
        refs.split.textContent = account.breakdown.map(function (entry) {
          return entry.label + ' ' + entry.percent + '%';
        }).join(' · ');
      }
    });
    paintPool(envelope.pool);
    paintTimes();
  }

  function render(envelope) {
    // Rebuild only when the shape changes; otherwise every value is repainted
    // into the nodes that already exist, so a page left open for days neither
    // grows nor flickers.
    var shape = JSON.stringify(envelope.accounts.map(function (account) {
      return [account.alias, account.active, account.email, account.organization,
        account.plan, account.state, account.message,
        account.rows.map(function (row) { return row.label; }),
        account.breakdown.length];
    }));
    if (shape !== signature) {
      signature = shape;
      nodes = [];
      listEl.textContent = '';
      envelope.accounts.forEach(function (account) {
        listEl.appendChild(buildAccount(account));
      });
    }
    paint(envelope);
  }

  function load() {
    fetch(ENDPOINT, { cache: 'no-store' }).then(function (response) {
      return response.json().then(function (body) {
        if (!response.ok || body.error) {
          throw new Error(body.error ? body.error.message : 'HTTP ' + response.status);
        }
        return body;
      });
    }).then(function (envelope) {
      render(envelope);
      lastUpdate = clock(envelope.generated_at);
      statusEl.dataset.bad = '0';
      statusEl.textContent = 'updated ' + lastUpdate;
    }).catch(function (error) {
      statusEl.dataset.bad = '1';
      statusEl.textContent = error.message + (lastUpdate ? ' · last update ' + lastUpdate : '');
    });
  }

  load();
  setInterval(load, POLL_MS);
  setInterval(paintTimes, CLOCK_MS);
</script>
</body>
</html>
